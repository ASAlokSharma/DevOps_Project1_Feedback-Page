<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Feedback Admin · NIET</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/admin">
      <img src="/assets/niet-logo.png" alt="NIET Greater Noida logo" />
      <div class="brand-text"><b>Noida Institute of Engineering &amp; Technology</b><span>Administrator Portal</span></div>
    </a>
  </header>
  <main class="admin">
    <header class="admin-head">
      <div><h1>Feedback dashboard</h1><p>All student submissions, newest first.</p></div>
      <div class="actions">
        <button class="ghost" id="refresh">↻ Refresh</button>
        <button id="export">Export CSV</button>
        <button class="ghost" id="logout">Log out</button>
      </div>
    </header>

    <section class="stats">
      <div class="stat"><b id="s-total">–</b><span>Total responses</span></div>
      <div class="stat"><b id="s-week">–</b><span>Last 7 days</span></div>
      <div class="stat"><b id="s-courses">–</b><span>Courses reviewed</span></div>
    </section>

    <div class="toolbar">
      <input type="search" id="q" placeholder="Search name, email, course or feedback…" />
      <select id="course"><option value="">All courses</option></select>
    </div>

    <div id="list" class="list"></div>
    <p id="status" class="empty-state">Loading feedback…</p>
  </main>

  <script type="module">
    const $ = (id) => document.getElementById(id);
    let all = [];
    const esc = (s) => { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };
    const fmt = (d) => new Date(d).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });

    async function load() {
      $('status').hidden = false; $('status').textContent = 'Loading feedback…';
      try {
        const res = await fetch('/admin/feedback');
        if (res.status === 401) { location.replace('/admin/login'); return; }
        if (!res.ok) throw new Error();
        all = await res.json();
        const courses = [...new Set(all.map((f) => f.course))].sort();
        $('course').innerHTML = '<option value="">All courses</option>' + courses.map((c) => `<option>${esc(c)}</option>`).join('');
        $('s-total').textContent = all.length;
        $('s-week').textContent = all.filter((f) => Date.now() - new Date(f.created_at) < 7 * 864e5).length;
        $('s-courses').textContent = courses.length;
        render();
      } catch {
        $('list').innerHTML = '';
        $('status').textContent = 'Could not load feedback. Check your login and try refreshing.';
      }
    }

    function filtered() {
      const q = $('q').value.trim().toLowerCase(), c = $('course').value;
      return all.filter((f) => (!c || f.course === c) &&
        (!q || [f.name, f.email, f.course, f.feedback].some((v) => (v || '').toLowerCase().includes(q))));
    }

    function render() {
      const rows = filtered();
      $('list').innerHTML = rows.map((f) => `
        <article class="item">
          <div class="item-top">
            <div class="avatar">${esc((f.name || '?')[0].toUpperCase())}</div>
            <div class="who"><b>${esc(f.name)}</b><a href="mailto:${esc(f.email)}">${esc(f.email)}</a></div>
            <span class="tag">${esc(f.course)}</span>
            <span class="when">${fmt(f.created_at)}</span>
          </div>
          <p>${esc(f.feedback)}</p>
        </article>`).join('');
      $('status').hidden = rows.length > 0;
      if (!rows.length) $('status').textContent = all.length ? 'No results match your filters.' : 'No feedback submitted yet.';
    }

    function exportCsv() {
      const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const head = ['Name', 'Email', 'Course', 'Feedback', 'Submitted'];
      const lines = filtered().map((f) => [f.name, f.email, f.course, f.feedback, f.created_at].map(q).join(','));
      const url = URL.createObjectURL(new Blob([[head.join(','), ...lines].join('\n')], { type: 'text/csv' }));
      Object.assign(document.createElement('a'), { href: url, download: 'feedback.csv' }).click();
      URL.revokeObjectURL(url);
    }

    $('q').addEventListener('input', render);
    $('course').addEventListener('change', render);
    $('refresh').addEventListener('click', load);
    $('export').addEventListener('click', exportCsv);
    $('logout').addEventListener('click', () => location.assign('/admin/logout'));
    load();
  </script>
</body>
</html>
